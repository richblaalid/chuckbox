# CI runs exactly the make verbs, so local, pre-push hook, and CI agree on
# what green means: make build → make lint → make test.
#
# Required repo secrets (Settings → Secrets → Actions):
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY  (dev project)
# The service-role key is intentionally NOT provided: the real-DB suite must
# never mutate the dev DB from CI. Since PLATFORM-009, `make test` is fully
# hermetic — tests/integration/ is excluded from the default run and only
# executes via the explicit `npm run test:integration` (local, dev creds).

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: make build
      - run: make lint
      - run: make test
